quarkus.application.name=inventory-service
quarkus.http.port=8085
quarkus.devservices.enabled=false

quarkus.oidc.auth-server-url=http://localhost:8180/realms/pcshop
quarkus.oidc.client-id=pcshop-backend
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.connection-delay=30S
pcshop.security.permission-client-id=pcshop-backend

quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.default-schema=inventory
quarkus.flyway.schemas=inventory
quarkus.flyway.locations=db/migration,db/seed

# Kiểm tra SKU khi nhập kho từ Excel: POST /api/v1/products/batch của catalog
quarkus.rest-client.catalog.url=http://localhost:8082

# Import/Export Excel (docs/import-export-guide.md): file giữ giữa bước validate và import, 1 giờ
quarkus.http.limits.max-body-size=6M
pcshop.import.dir=${java.io.tmpdir}/pcshop-import/inventory
pcshop.import.ttl=PT1H
pcshop.import.max-rows=1000
pcshop.excel.max-export-rows=10000

# Saga đặt hàng (Kafka luôn chạy local ở cả 2 profile). Nhận order.created/cancelled/shipped, xử lý tuần tự;
# lỗi không xử lý được thì chuyển sang topic dead-letter-topic-<channel> thay vì dừng consumer.
kafka.bootstrap.servers=localhost:9092
mp.messaging.incoming.order-created.connector=smallrye-kafka
mp.messaging.incoming.order-created.topic=order.created
mp.messaging.incoming.order-cancelled.connector=smallrye-kafka
mp.messaging.incoming.order-cancelled.topic=order.cancelled
mp.messaging.incoming.order-shipped.connector=smallrye-kafka
mp.messaging.incoming.order-shipped.topic=order.shipped
mp.messaging.incoming.order-created.group.id=inventory-service
mp.messaging.incoming.order-cancelled.group.id=inventory-service
mp.messaging.incoming.order-shipped.group.id=inventory-service
mp.messaging.incoming.order-created.auto.offset.reset=earliest
mp.messaging.incoming.order-cancelled.auto.offset.reset=earliest
mp.messaging.incoming.order-shipped.auto.offset.reset=earliest
mp.messaging.incoming.order-created.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-cancelled.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-shipped.failure-strategy=dead-letter-queue
# Gửi stock.reserved / stock.reserve-failed: topic thật đặt theo từng message (OutboxRelay)
mp.messaging.outgoing.stock-events.connector=smallrye-kafka
mp.messaging.outgoing.stock-events.topic=stock.reserved
