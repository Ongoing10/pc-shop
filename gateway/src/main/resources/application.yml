server:
  port: 8000

spring:
  application:
    name: gateway
  profiles:
    default: dev

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Gateway giống nhau ở cả 2 profile: các service luôn chạy trên máy mình.
pcshop:
  cors:
    allowed-origin: http://localhost:3000
  services:
    customer: http://localhost:8081
    catalog: http://localhost:8082
    cart: http://localhost:8083
    ordering: http://localhost:8084
    inventory: http://localhost:8085
    review: http://localhost:8086
    ai: http://localhost:8087
    media: http://localhost:8088
    notification: http://localhost:8089
