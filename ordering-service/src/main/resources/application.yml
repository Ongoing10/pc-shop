server:
  port: 8084

spring:
  application:
    name: ordering-service
  profiles:
    default: dev
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/pcshop
          jwk-set-uri: http://localhost:8180/realms/pcshop/protocol/openid-connect/certs

pcshop:
  security:
    permission-client-id: pcshop-backend
    public-get-paths:
      - /api/v1/vouchers
  # Service khác luôn chạy trên máy mình ở cả 2 profile (giống gateway)
  services:
    cart: http://localhost:8083
    customer: http://localhost:8081
  # Phí vận chuyển cho POST /checkout/preview (ShippingProperties)
  shipping:
    inner-provinces: ["79", "01"]   # tỉnh có kho: HCM, Hà Nội
    inner-fee: 20000
    outer-fee: 40000
    free-threshold: 5000000
  # Export Excel (EXP-1): số đơn tối đa mỗi lần, vượt thì yêu cầu thu hẹp bộ lọc
  excel:
    max-export-rows: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
