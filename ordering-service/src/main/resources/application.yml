server:
  port: 8084

spring:
  application:
    name: ordering-service
  profiles:
    default: dev
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  # Relay outbox (mỗi giây) và job hủy đơn quá hạn không chờ nhau
  task:
    scheduling:
      pool:
        size: 2
  # Kafka luôn chạy local (docker compose), cả 2 profile
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
    consumer:
      group-id: ordering-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/pcshop
          jwk-set-uri: http://localhost:8180/realms/pcshop/protocol/openid-connect/certs

pcshop:
  security:
    permission-client-id: pcshop-backend
    public-get-paths:
      - /api/v1/vouchers
      # Cổng thanh toán / trình duyệt gọi về, không có token (VNPay kiểm bằng chữ ký)
      - /api/v1/payments/vnpay/**
      - /api/v1/payments/mock/**
  # Service khác luôn chạy trên máy mình ở cả 2 profile (giống gateway)
  services:
    cart: http://localhost:8083
    customer: http://localhost:8081
  # Phí vận chuyển cho POST /checkout/preview (ShippingProperties)
  shipping:
    inner-provinces: ["79", "01"]   # tỉnh có kho: HCM, Hà Nội
    inner-fee: 20000
    outer-fee: 40000
    free-threshold: 5000000
  # Đặt hàng (POST /orders): đơn online chưa thanh toán quá hạn thì tự hủy và nhả hàng
  order:
    payment-timeout: PT15M
  # Thanh toán online (PaymentProperties). Khóa VNPay sandbox đặt trong .env: VNPAY_TMN_CODE, VNPAY_HASH_SECRET.
  # Chưa có khóa → đơn VNPay/MoMo đi qua trang giả lập: chỉ bật ở profile local/dev (application-local/dev.yml).
  # Trang giả lập công khai, ai biết mã thanh toán cũng tự báo "đã trả" được, nên mặc định TẮT.
  payment:
    public-base-url: http://localhost:8000
    frontend-return-url: http://localhost:3000/orders/payment-result
    mock-enabled: false
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  # Export Excel (EXP-1): số đơn tối đa mỗi lần, vượt thì yêu cầu thu hẹp bộ lọc
  excel:
    max-export-rows: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
