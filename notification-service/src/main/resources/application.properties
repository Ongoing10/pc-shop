quarkus.application.name=notification-service
quarkus.http.port=8089
quarkus.devservices.enabled=false

quarkus.oidc.auth-server-url=http://localhost:8180/realms/pcshop
quarkus.oidc.client-id=pcshop-backend
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.connection-delay=30S
pcshop.security.permission-client-id=pcshop-backend

quarkus.mongodb.database=notification
# Seed vài thông báo mẫu cho customer1 khi collection rỗng (chỉ bật ở profile local)
pcshop.seed-demo=false

# Sinh thông báo từ event (Kafka luôn chạy local ở cả 2 profile). Lỗi xử lý → topic dead-letter-topic-<channel>.
# Consumer group mới (lần đầu chạy) đọc từ event MỚI (latest): không sinh thông báo / gửi email cho toàn bộ lịch sử đơn.
kafka.bootstrap.servers=localhost:9092
mp.messaging.incoming.order-status-changed.connector=smallrye-kafka
mp.messaging.incoming.order-status-changed.topic=order.status-changed
mp.messaging.incoming.order-status-changed.group.id=notification-service
mp.messaging.incoming.order-status-changed.auto.offset.reset=latest
mp.messaging.incoming.order-status-changed.failure-strategy=dead-letter-queue
mp.messaging.incoming.review-replied.connector=smallrye-kafka
mp.messaging.incoming.review-replied.topic=review.replied
mp.messaging.incoming.review-replied.group.id=notification-service
mp.messaging.incoming.review-replied.auto.offset.reset=latest
mp.messaging.incoming.review-replied.failure-strategy=dead-letter-queue

# Email (NotificationMailer). Mặc định gửi vào Mailpit trong docker-compose (xem http://localhost:8025, không gửi ra ngoài).
# Gửi thật: đặt MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_START_TLS=REQUIRED trong .env.
quarkus.mailer.from=PC Shop <no-reply@pcshop.local>
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:1025}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.start-tls=${MAIL_START_TLS:DISABLED}
quarkus.mailer.mock=false
pcshop.mail.enabled=true
# Trạng thái đơn được gửi email (thông báo trong ứng dụng thì có ở mọi trạng thái 2–8)
pcshop.mail.order-statuses=2,3,4,5,6,7,8
# Event cũ hơn mức này (service dừng lâu rồi chạy lại) vẫn có thông báo trong ứng dụng nhưng không gửi email
pcshop.mail.max-event-age=PT1H
# Link trong email và trong thông báo
pcshop.frontend-url=http://localhost:3000
# Vé mở stream SSE (EventSource không gửi được header Authorization)
pcshop.stream.ticket-ttl=PT60S
