<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>{title}</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px">
    <tr>
      <td style="padding:20px 28px;border-bottom:1px solid #e4e7eb;font-size:18px;font-weight:bold;color:#1d4ed8">PC Shop</td>
    </tr>
    <tr>
      <td style="padding:24px 28px">
        <p style="margin:0 0 12px">Xin chào {name},</p>
        <h1 style="margin:0 0 12px;font-size:20px">{title}</h1>
        <p style="margin:0 0 20px;line-height:1.5">{content}</p>
        <p style="margin:0 0 24px">
          <a href="{orderUrl}" style="display:inline-block;padding:10px 20px;background:#1d4ed8;color:#ffffff;text-decoration:none;border-radius:6px">
            {#if needsPayment}Thanh toán ngay{#else}Xem đơn {orderCode}{/if}
          </a>
        </p>
        <p style="margin:0;font-size:12px;color:#7b8794">Email tự động, vui lòng không trả lời. Mã đơn: {orderCode}</p>
      </td>
    </tr>
  </table>
</body>
</html>
