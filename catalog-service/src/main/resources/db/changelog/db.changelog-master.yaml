  - changeSet:
      id: 20261027-1000-categories-spec-schema
      author: pcshop
      changes:
        # Thông số theo danh mục: cột động của file Excel sản phẩm (IMP-1/EXP-2) và form nhập của admin.
        # group: compat (rule engine dùng, lưu ở products.compat) | specs (hiển thị, lưu ở products.specs)
        # type: string | integer | decimal | boolean | string_list (nhiều giá trị, cách nhau dấu phẩy)
        # Liquibase MongoDB không có updateMany: dùng runCommand lệnh "update".
        - runCommand:
            command: >
              { "update": "categories", "updates": [
                { "q": { "code": "CPU" }, "u": { "$set": { "spec_schema": [
                  { "key": "socket", "label": "Socket", "group": "compat", "type": "string", "required": true, "options": ["LGA1700", "LGA1851", "AM4", "AM5"] },
                  { "key": "memory_types", "label": "Chuẩn RAM hỗ trợ", "group": "compat", "type": "string_list", "required": true, "options": ["DDR4", "DDR5"] },
                  { "key": "tdp_w", "label": "TDP", "group": "compat", "type": "integer", "required": true, "unit": "W" },
                  { "key": "cores", "label": "Số nhân", "group": "specs", "type": "integer", "required": false },
                  { "key": "threads", "label": "Số luồng", "group": "specs", "type": "integer", "required": false },
                  { "key": "base_clock_ghz", "label": "Xung cơ bản", "group": "specs", "type": "decimal", "required": false, "unit": "GHz" },
                  { "key": "boost_clock_ghz", "label": "Xung tối đa", "group": "specs", "type": "decimal", "required": false, "unit": "GHz" },
                  { "key": "cache_mb", "label": "Bộ nhớ đệm", "group": "specs", "type": "integer", "required": false, "unit": "MB" } ] } } },
                { "q": { "code": "MAINBOARD" }, "u": { "$set": { "spec_schema": [
                  { "key": "socket", "label": "Socket", "group": "compat", "type": "string", "required": true, "options": ["LGA1700", "LGA1851", "AM4", "AM5"] },
                  { "key": "memory_type", "label": "Chuẩn RAM", "group": "compat", "type": "string", "required": true, "options": ["DDR4", "DDR5"] },
                  { "key": "form_factor", "label": "Kích thước", "group": "compat", "type": "string", "required": true, "options": ["E-ATX", "ATX", "mATX", "ITX"] },
                  { "key": "ram_slots", "label": "Số khe RAM", "group": "compat", "type": "integer", "required": true },
                  { "key": "m2_slots", "label": "Số khe M.2", "group": "compat", "type": "integer", "required": false },
                  { "key": "chipset", "label": "Chipset", "group": "specs", "type": "string", "required": false } ] } } },
                { "q": { "code": "RAM" }, "u": { "$set": { "spec_schema": [
                  { "key": "memory_type", "label": "Chuẩn RAM", "group": "compat", "type": "string", "required": true, "options": ["DDR4", "DDR5"] },
                  { "key": "modules", "label": "Số thanh", "group": "compat", "type": "integer", "required": true },
                  { "key": "capacity_gb", "label": "Dung lượng", "group": "specs", "type": "integer", "required": false, "unit": "GB" },
                  { "key": "speed_mhz", "label": "Bus", "group": "specs", "type": "integer", "required": false, "unit": "MHz" } ] } } },
                { "q": { "code": "GPU" }, "u": { "$set": { "spec_schema": [
                  { "key": "length_mm", "label": "Chiều dài", "group": "compat", "type": "integer", "required": true, "unit": "mm" },
