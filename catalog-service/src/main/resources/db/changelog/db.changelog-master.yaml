  - changeSet:
      id: 20261025-1000-products-text-index
      author: pcshop
      changes:
        # Text index cho GET /products/search. Mongo không có bộ tách từ tiếng Việt: default_language "none"
        # để không stem/bỏ stopword tiếng Anh. Mỗi collection chỉ được một text index.
        - createIndex:
            collectionName: products
            keys: '{ "name": "text", "short_description": "text", "tags": "text" }'
            options: '{ "name": "txt_products_search", "default_language": "none", "weights": { "name": 10, "tags": 5, "short_description": 1 } }'
        - createIndex:
            collectionName: products
            keys: '{ "brand_code": 1, "status": 1 }'
            options: '{ "name": "idx_products_brand_status" }'

