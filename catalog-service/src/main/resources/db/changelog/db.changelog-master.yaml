            documents: >
              [
                { "code": "CPU_MB_SOCKET", "name": "Socket CPU khớp mainboard", "source_category": "CPU", "target_category": "MAINBOARD",
                  "rule_type": "EQUALS", "source_field": "socket", "target_field": "socket", "severity": 1,
                  "message_template": "CPU {source} dùng socket {sv} không khớp mainboard {target} ({tv})", "is_active": 1 },
                { "code": "RAM_MB_TYPE", "name": "Chuẩn RAM khớp mainboard", "source_category": "RAM", "target_category": "MAINBOARD",
                  "rule_type": "EQUALS", "source_field": "memory_type", "target_field": "memory_type", "severity": 1,
