                { "code": "RAM",       "name": "RAM",              "slug": "ram",       "pc_slot": "RAM",       "sort_order": 3, "is_active": 1 },
                { "code": "GPU",       "name": "Card đồ họa",      "slug": "vga",       "pc_slot": "GPU",       "sort_order": 4, "is_active": 1 },
                { "code": "STORAGE",   "name": "Ổ cứng",           "slug": "o-cung",    "pc_slot": "STORAGE",   "sort_order": 5, "is_active": 1 },
