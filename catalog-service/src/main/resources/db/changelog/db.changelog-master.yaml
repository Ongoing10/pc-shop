# Migration MongoDB của catalog-service (Liquibase MongoDB). Mỗi changeSet chỉ chạy MỘT lần
# (được ghi vào collection DATABASECHANGELOG). Đã chạy thì KHÔNG sửa, muốn đổi thì thêm changeSet mới.
# Với Mongo, migration gồm: tạo index, seed dữ liệu nền, chuyển đổi dữ liệu khi đổi cấu trúc document.
databaseChangeLog:

  - changeSet:
      id: 20261024-1000-collections-indexes
      author: pcshop
      changes:
        - createCollection:
            collectionName: categories
        - createIndex:
            collectionName: categories
            keys: '{ "code": 1 }'
            options: '{ "unique": true, "name": "uk_categories_code" }'
        - createIndex:
            collectionName: categories
            keys: '{ "slug": 1 }'
            options: '{ "unique": true, "name": "uk_categories_slug" }'

        - createCollection:
            collectionName: brands
        - createIndex:
            collectionName: brands
            keys: '{ "code": 1 }'
            options: '{ "unique": true, "name": "uk_brands_code" }'

        - createCollection:
            collectionName: products
        - createIndex:
            collectionName: products
            keys: '{ "sku": 1 }'
            options: '{ "unique": true, "name": "uk_products_sku" }'
        - createIndex:
            collectionName: products
            keys: '{ "slug": 1 }'
            options: '{ "unique": true, "name": "uk_products_slug" }'
        - createIndex:
            collectionName: products
            keys: '{ "category_code": 1, "status": 1, "price": 1 }'
            options: '{ "name": "idx_products_cat_status_price" }'
        - createIndex:
            collectionName: products
            keys: '{ "category_code": 1, "compat.socket": 1 }'
            options: '{ "name": "idx_products_cat_socket" }'

        - createCollection:
            collectionName: compatibility_rules
        - createIndex:
            collectionName: compatibility_rules
            keys: '{ "code": 1 }'
            options: '{ "unique": true, "name": "uk_compat_rules_code" }'

        - createCollection:
            collectionName: pc_builds
        - createIndex:
            collectionName: pc_builds
            keys: '{ "code": 1 }'
            options: '{ "unique": true, "name": "uk_pc_builds_code" }'
        - createIndex:
            collectionName: pc_builds
            keys: '{ "user_id": 1, "created_at": -1 }'
            options: '{ "name": "idx_pc_builds_user_created" }'

        - createCollection:
            collectionName: price_histories
        - createIndex:
            collectionName: price_histories
            keys: '{ "sku": 1, "changed_at": -1 }'
            options: '{ "name": "idx_price_histories_sku_changed" }'

  - changeSet:
      id: 20261024-1001-seed-categories-brands
      author: pcshop
      changes:
        - insertMany:
            collectionName: categories
            documents: >
              [
                { "code": "CPU",       "name": "Bộ vi xử lý",      "slug": "cpu",       "pc_slot": "CPU",       "sort_order": 1, "is_active": 1 },
                { "code": "MAINBOARD", "name": "Bo mạch chủ",      "slug": "mainboard", "pc_slot": "MAINBOARD", "sort_order": 2, "is_active": 1 },
                { "code": "RAM",       "name": "RAM",              "slug": "ram",       "pc_slot": "RAM",       "sort_order": 3, "is_active": 1 },
                { "code": "GPU",       "name": "Card đồ họa",      "slug": "vga",       "pc_slot": "GPU",       "sort_order": 4, "is_active": 1 },
                { "code": "STORAGE",   "name": "Ổ cứng",           "slug": "o-cung",    "pc_slot": "STORAGE",   "sort_order": 5, "is_active": 1 },
                { "code": "PSU",       "name": "Nguồn",            "slug": "nguon",     "pc_slot": "PSU",       "sort_order": 6, "is_active": 1 },
                { "code": "CASE",      "name": "Vỏ case",          "slug": "case",      "pc_slot": "CASE",      "sort_order": 7, "is_active": 1 },
                { "code": "COOLER",    "name": "Tản nhiệt",        "slug": "tan-nhiet", "pc_slot": "COOLER",    "sort_order": 8, "is_active": 1 }
              ]
        - insertMany:
            collectionName: brands
            documents: >
              [
                { "code": "INTEL",    "name": "Intel",    "slug": "intel",    "is_active": 1 },
                { "code": "AMD",      "name": "AMD",      "slug": "amd",      "is_active": 1 },
                { "code": "ASUS",     "name": "ASUS",     "slug": "asus",     "is_active": 1 },
                { "code": "MSI",      "name": "MSI",      "slug": "msi",      "is_active": 1 },
                { "code": "GIGABYTE", "name": "Gigabyte", "slug": "gigabyte", "is_active": 1 },
                { "code": "CORSAIR",  "name": "Corsair",  "slug": "corsair",  "is_active": 1 },
                { "code": "KINGSTON", "name": "Kingston", "slug": "kingston", "is_active": 1 }
              ]

  - changeSet:
      id: 20261024-1002-seed-compatibility-rules
      author: pcshop
      changes:
        - insertMany:
            collectionName: compatibility_rules
            documents: >
              [
                { "code": "CPU_MB_SOCKET", "name": "Socket CPU khớp mainboard", "source_category": "CPU", "target_category": "MAINBOARD",
                  "rule_type": "EQUALS", "source_field": "socket", "target_field": "socket", "severity": 1,
                  "message_template": "CPU {source} dùng socket {sv} không khớp mainboard {target} ({tv})", "is_active": 1 },
                { "code": "RAM_MB_TYPE", "name": "Chuẩn RAM khớp mainboard", "source_category": "RAM", "target_category": "MAINBOARD",
                  "rule_type": "EQUALS", "source_field": "memory_type", "target_field": "memory_type", "severity": 1,
                  "message_template": "RAM {source} là {sv} nhưng mainboard {target} hỗ trợ {tv}", "is_active": 1 },
                { "code": "PSU_WATTAGE", "name": "Công suất nguồn đủ cho cấu hình", "source_category": "*", "target_category": "PSU",
                  "rule_type": "SUM_TDP_LTE_WATTAGE", "source_field": "tdp_w", "target_field": "wattage", "margin": 1.2, "severity": 1,
                  "message_template": "Tổng công suất ước tính {sv}W vượt khả năng nguồn {target} ({tv}W, đã tính hệ số an toàn)", "is_active": 1 },
                { "code": "GPU_CASE_LENGTH", "name": "Chiều dài VGA vừa case", "source_category": "GPU", "target_category": "CASE",
                  "rule_type": "LTE", "source_field": "length_mm", "target_field": "max_gpu_length_mm", "severity": 1,
                  "message_template": "VGA {source} dài {sv}mm, case {target} chỉ chứa tối đa {tv}mm", "is_active": 1 }
              ]

