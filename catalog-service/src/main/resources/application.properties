quarkus.application.name=catalog-service
quarkus.http.port=8082
quarkus.devservices.enabled=false

quarkus.oidc.auth-server-url=http://localhost:8180/realms/pcshop
quarkus.oidc.client-id=pcshop-backend
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.connection-delay=30S
pcshop.security.permission-client-id=pcshop-backend

quarkus.mongodb.database=catalog
quarkus.liquibase-mongodb.change-log=db/changelog/db.changelog-master.yaml

# Import/Export Excel (docs/import-export-guide.md): file giữ giữa bước validate và import, 1 giờ
quarkus.http.limits.max-body-size=6M
pcshop.import.dir=${java.io.tmpdir}/pcshop-import/catalog
pcshop.import.ttl=PT1H
pcshop.import.max-rows=1000
pcshop.excel.max-export-rows=10000

# sold_count theo đơn hàng, điểm sao theo review (Kafka luôn chạy local ở cả 2 profile). Lỗi xử lý → topic dead-letter-topic-<channel>.
kafka.bootstrap.servers=localhost:9092
mp.messaging.incoming.order-completed.connector=smallrye-kafka
mp.messaging.incoming.order-completed.topic=order.completed
mp.messaging.incoming.order-completed.group.id=catalog-service
mp.messaging.incoming.order-completed.auto.offset.reset=earliest
mp.messaging.incoming.order-completed.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-returned.connector=smallrye-kafka
mp.messaging.incoming.order-returned.topic=order.returned
mp.messaging.incoming.order-returned.group.id=catalog-service
mp.messaging.incoming.order-returned.auto.offset.reset=earliest
mp.messaging.incoming.order-returned.failure-strategy=dead-letter-queue
mp.messaging.incoming.review-stats-changed.connector=smallrye-kafka
mp.messaging.incoming.review-stats-changed.topic=review.stats-changed
mp.messaging.incoming.review-stats-changed.group.id=catalog-service
mp.messaging.incoming.review-stats-changed.auto.offset.reset=earliest
mp.messaging.incoming.review-stats-changed.failure-strategy=dead-letter-queue
# Gửi product.updated / product.hidden cho ai-service: topic thật đặt theo từng message (ProductEvents)
mp.messaging.outgoing.product-events.connector=smallrye-kafka
mp.messaging.outgoing.product-events.topic=product.updated
