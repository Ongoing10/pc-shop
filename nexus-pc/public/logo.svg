<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">NEXUS PC</title>
  <!-- Nền cam thương hiệu (biến CSS accent) -->
  <rect width="64" height="64" rx="15" fill="#ff6b1a"/>
  <!-- Chân chip: 3 chân mỗi cạnh -->
  <g fill="#1a0f07">
    <rect x="22" y="8" width="4" height="8" rx="1.5"/>
    <rect x="30" y="8" width="4" height="8" rx="1.5"/>
    <rect x="38" y="8" width="4" height="8" rx="1.5"/>
    <rect x="22" y="48" width="4" height="8" rx="1.5"/>
    <rect x="30" y="48" width="4" height="8" rx="1.5"/>
    <rect x="38" y="48" width="4" height="8" rx="1.5"/>
    <rect x="8" y="22" width="8" height="4" rx="1.5"/>
    <rect x="8" y="30" width="8" height="4" rx="1.5"/>
    <rect x="8" y="38" width="8" height="4" rx="1.5"/>
    <rect x="48" y="22" width="8" height="4" rx="1.5"/>
    <rect x="48" y="30" width="8" height="4" rx="1.5"/>
    <rect x="48" y="38" width="8" height="4" rx="1.5"/>
  </g>
  <!-- Thân chip -->
  <rect x="14" y="14" width="36" height="36" rx="7" fill="#1a0f07"/>
  <!-- Chữ N vẽ như một đường mạch, hai đầu là điểm hàn -->
  <path d="M24 41V23l16 18V23" fill="none" stroke="#ff6b1a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="41" r="3.6" fill="#ff6b1a"/>
  <circle cx="40" cy="23" r="3.6" fill="#ff6b1a"/>
  <circle cx="24" cy="41" r="1.4" fill="#1a0f07"/>
  <circle cx="40" cy="23" r="1.4" fill="#1a0f07"/>
</svg>
