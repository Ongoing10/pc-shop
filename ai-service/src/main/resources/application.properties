quarkus.application.name=ai-service
quarkus.http.port=8087
quarkus.devservices.enabled=false

# ----- Xác thực -----
quarkus.oidc.auth-server-url=http://localhost:8180/realms/pcshop
quarkus.oidc.client-id=pcshop-backend
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.connection-delay=30S
pcshop.security.permission-client-id=pcshop-backend

# ----- DB (pgvector) -----
quarkus.datasource.db-kind=postgresql
quarkus.flyway.schemas=ai

# ----- LLM + embedding qua Ollama (chạy local, miễn phí) -----
# Cần tải model trước: ollama pull qwen2.5:7b   và   ollama pull bge-m3
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=qwen2.5:7b
quarkus.langchain4j.ollama.chat-model.temperature=0.2
# bge-m3: đa ngôn ngữ (có tiếng Việt), 1024 chiều = cột vector(1024). Đổi model khác số chiều phải migrate.
quarkus.langchain4j.ollama.embedding-model.model-id=bge-m3
quarkus.langchain4j.ollama.timeout=120s
# Bật để xem prompt (có cả đoạn RAG chèn vào) và lời gọi tool trong log khi phát triển
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# ----- Service khác (tool calling lấy dữ liệu realtime) -----
quarkus.rest-client.catalog.url=http://localhost:8082
quarkus.rest-client.inventory.url=http://localhost:8085
