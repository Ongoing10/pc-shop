quarkus.application.name=ai-service
quarkus.http.port=8087
quarkus.devservices.enabled=false

# ----- Xác thực -----
quarkus.oidc.auth-server-url=http://localhost:8180/realms/pcshop
quarkus.oidc.client-id=pcshop-backend
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.connection-delay=30S
pcshop.security.permission-client-id=pcshop-backend

# ----- DB (pgvector) -----
quarkus.datasource.db-kind=postgresql
quarkus.flyway.schemas=ai

# ----- Lịch sử chat (Mongo database "ai", collection chat_sessions) -----
quarkus.mongodb.database=ai

# ----- LLM + embedding qua Gemini API (Google AI Studio, gói miễn phí) -----
# Lấy key ở https://aistudio.google.com/apikey, đặt GEMINI_API_KEY=... vào ai-service/.env (Quarkus tự đọc .env ở thư mục
# chạy, KHÔNG commit) hoặc biến môi trường. Gói miễn phí giới hạn số request/phút: nạp lại nhiều sản phẩm một lúc có thể bị 429.
quarkus.langchain4j.ai.gemini.api-key=${GEMINI_API_KEY:}
quarkus.langchain4j.ai.gemini.timeout=60s
quarkus.langchain4j.ai.gemini.chat-model.model-id=gemini-2.5-flash
quarkus.langchain4j.ai.gemini.chat-model.temperature=0.2
quarkus.langchain4j.ai.gemini.chat-model.max-output-tokens=2048
# gemini-embedding-001 mặc định 3072 chiều; cắt về 1024 cho khớp cột vector(1024) (HNSW chỉ nhận tối đa 2000 chiều).
# Vector cắt ngắn không chuẩn hóa nhưng truy vấn dùng cosine (<=>) nên không ảnh hưởng.
quarkus.langchain4j.ai.gemini.embedding-model.model-id=gemini-embedding-001
quarkus.langchain4j.ai.gemini.embedding-model.output-dimension=1024
quarkus.langchain4j.devservices.enabled=false
# KHÔNG bật log request của Gemini: client gửi key trong URL (?key=...) nên log sẽ lộ API key.
# Log response của chat (xem lời gọi tool, câu trả lời) thì an toàn; embedding tắt vì in cả 1024 số mỗi đoạn.
quarkus.langchain4j.ai.gemini.log-requests=false
quarkus.langchain4j.ai.gemini.chat-model.log-requests=false
quarkus.langchain4j.ai.gemini.chat-model.log-responses=true
quarkus.langchain4j.ai.gemini.embedding-model.log-requests=false
quarkus.langchain4j.ai.gemini.embedding-model.log-responses=false
# Bộ nhớ hội thoại: giữ 12 message gần nhất (tính cả lời gọi tool)
quarkus.langchain4j.chat-memory.memory-window.max-messages=12

# ----- Cũ: LLM + embedding qua Ollama (chạy local). Quay lại: bỏ comment phần này, Ollama trong pom.xml và model/OllamaModels*.java -----
# Chỉ cần cài Ollama: thiếu model nào thì OllamaModels tự tải khi ai-service khởi động (xem mục "Tự tải model" bên dưới).
#quarkus.langchain4j.ollama.base-url=http://localhost:11434
# Dev Services riêng của langchain4j (không theo quarkus.devservices.enabled): ở dev mode nó tự pull + nạp sẵn chat model
# lúc build; Ollama lỗi khi nạp model là dev mode không khởi động được (kẹt recovery). Thay bằng OllamaModels (chỉ tải, chạy nền).
#quarkus.langchain4j.ollama.chat-model.model-id=qwen2.5:7b
#quarkus.langchain4j.ollama.chat-model.temperature=0.2
# bge-m3: đa ngôn ngữ (có tiếng Việt), 1024 chiều = cột vector(1024). Đổi model khác số chiều phải migrate.
#quarkus.langchain4j.ollama.embedding-model.model-id=bge-m3
#quarkus.langchain4j.ollama.timeout=120s
# Ollama mặc định chỉ có ngữ cảnh 4096 token (đặt OLLAMA_CONTEXT_LENGTH=8192 trước khi chạy ollama serve nếu máy đủ RAM).

# ----- Cũ: tự tải model (OllamaModels) -----
# Khởi động thì kiểm tra chat model + embedding model, thiếu thì `ollama pull` chạy nền (log ghi tiến độ, /q/health/ready
# báo trạng thái). Đang tải thì chat trả "đang tải model ...%". Tắt nếu muốn tự quản lý model.
#pcshop.ai.models.auto-pull=true
# Model tùy chỉnh: khi chat model-id là tên này mà Ollama chưa có, tải model gốc rồi tạo kèm tham số (dùng chung trọng số,
# không tốn thêm dung lượng). Máy có GPU yếu / Ollama sập khi nạp lên GPU thì chạy ai-service với
# -Dquarkus.langchain4j.ollama.chat-model.model-id=pcshop-qwen -Dquarkus.langchain4j.ollama.timeout=300s (chạy CPU).
#pcshop.ai.models.custom.name=pcshop-qwen
#pcshop.ai.models.custom.from=qwen2.5:7b
#pcshop.ai.models.custom.num-gpu=0
#pcshop.ai.models.custom.num-ctx=8192

# ----- Kafka: catalog báo sản phẩm đổi nội dung / bị ẩn -----
kafka.bootstrap.servers=localhost:9092
mp.messaging.incoming.product-updated.connector=smallrye-kafka
mp.messaging.incoming.product-updated.topic=product.updated
mp.messaging.incoming.product-updated.group.id=ai-service
mp.messaging.incoming.product-updated.auto.offset.reset=earliest
mp.messaging.incoming.product-updated.failure-strategy=dead-letter-queue
mp.messaging.incoming.product-hidden.connector=smallrye-kafka
mp.messaging.incoming.product-hidden.topic=product.hidden
mp.messaging.incoming.product-hidden.group.id=ai-service
mp.messaging.incoming.product-hidden.auto.offset.reset=earliest
mp.messaging.incoming.product-hidden.failure-strategy=dead-letter-queue

# ----- Service khác (tool calling lấy dữ liệu realtime) -----
quarkus.rest-client.catalog.url=http://localhost:8082
quarkus.rest-client.inventory.url=http://localhost:8085
# Tool chạy giữa lúc LLM đang chờ: service kia chết thì báo lỗi nhanh, không treo cả câu trả lời
quarkus.rest-client.catalog.connect-timeout=3000
quarkus.rest-client.catalog.read-timeout=10000
quarkus.rest-client.inventory.connect-timeout=3000
quarkus.rest-client.inventory.read-timeout=10000
