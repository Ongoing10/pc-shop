# Supabase dùng chung: embedding đã sinh được dùng lại giữa các thành viên (không phải embed lại)
quarkus.datasource.jdbc.url=jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres
quarkus.datasource.username=${SUPABASE_DB_USER}
quarkus.datasource.password=${SUPABASE_DB_PASSWORD}
quarkus.datasource.jdbc.max-size=5
quarkus.flyway.migrate-at-start=false
# MongoDB Atlas dùng chung (như catalog-service)
quarkus.mongodb.connection-string=mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_HOST}/?retryWrites=true&w=majority&maxPoolSize=10
