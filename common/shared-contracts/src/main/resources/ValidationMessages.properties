# Message mặc định của Bean Validation bằng tiếng Việt, dùng chung cho mọi service (Spring lẫn Quarkus).
# Hibernate Validator đọc bundle "ValidationMessages" trên classpath trước bundle tiếng Anh có sẵn.
# Ràng buộc khai message riêng (vd @Pattern(message = "...")) vẫn dùng message đó.
jakarta.validation.constraints.AssertFalse.message=phải là false
jakarta.validation.constraints.AssertTrue.message=phải là true
jakarta.validation.constraints.DecimalMax.message=phải nhỏ hơn ${inclusive == true ? 'hoặc bằng ' : ''}{value}
jakarta.validation.constraints.DecimalMin.message=phải lớn hơn ${inclusive == true ? 'hoặc bằng ' : ''}{value}
jakarta.validation.constraints.Digits.message=tối đa {integer} chữ số phần nguyên và {fraction} chữ số phần thập phân
jakarta.validation.constraints.Email.message=email không hợp lệ
jakarta.validation.constraints.Future.message=phải là thời điểm trong tương lai
jakarta.validation.constraints.FutureOrPresent.message=phải là hiện tại hoặc tương lai
jakarta.validation.constraints.Max.message=phải nhỏ hơn hoặc bằng {value}
jakarta.validation.constraints.Min.message=phải lớn hơn hoặc bằng {value}
jakarta.validation.constraints.Negative.message=phải nhỏ hơn 0
jakarta.validation.constraints.NegativeOrZero.message=phải nhỏ hơn hoặc bằng 0
jakarta.validation.constraints.NotBlank.message=không được để trống
jakarta.validation.constraints.NotEmpty.message=không được để trống
jakarta.validation.constraints.NotNull.message=bắt buộc
jakarta.validation.constraints.Null.message=phải để trống
jakarta.validation.constraints.Past.message=phải là thời điểm trong quá khứ
jakarta.validation.constraints.PastOrPresent.message=phải là quá khứ hoặc hiện tại
jakarta.validation.constraints.Pattern.message=không đúng định dạng
jakarta.validation.constraints.Positive.message=phải lớn hơn 0
jakarta.validation.constraints.PositiveOrZero.message=phải lớn hơn hoặc bằng 0
jakarta.validation.constraints.Size.message=phải có từ {min} đến {max} ký tự/phần tử
