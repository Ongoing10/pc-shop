# Cấu hình mặc định cho mọi service Quarkus dùng common-quarkus.
# Độ ưu tiên thấp hơn application.properties của service, nên service vẫn ghi đè được.

# Swagger UI có cả khi chạy jar (mặc định Quarkus chỉ bật ở dev mode), nút Authorize dùng Bearer JWT
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.security-scheme=jwt

# Mỗi dòng log kèm X-Request-Id (RequestIdFilter đặt vào MDC)
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%X{requestId}] [%c{2.}] (%t) %s%e%n
