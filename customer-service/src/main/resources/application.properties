# ===== Chung cho mọi profile =====
quarkus.application.name=customer-service
quarkus.http.port=8081
# Không để Quarkus tự bật container DB/Kafka riêng: hạ tầng do docker-compose của nhóm quản lý
quarkus.devservices.enabled=false

# ----- Xác thực: kiểm tra JWT của Keycloak -----
quarkus.oidc.auth-server-url=http://localhost:8180/realms/pcshop
quarkus.oidc.client-id=pcshop-backend
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Keycloak chưa lên thì thử lại trong 30 giây thay vì lỗi ngay
quarkus.oidc.connection-delay=30S
pcshop.security.permission-client-id=pcshop-backend

# ----- Gọi Keycloak Admin API bằng token của chính service (client credentials) -----
quarkus.oidc-client.auth-server-url=http://localhost:8180/realms/pcshop
quarkus.oidc-client.client-id=pcshop-backend
quarkus.oidc-client.credentials.secret=${KEYCLOAK_BACKEND_SECRET:backend-secret-local}
quarkus.oidc-client.grant.type=client
quarkus.rest-client.keycloak-admin.url=http://localhost:8180

# ----- DB -----
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.default-schema=customer
quarkus.flyway.schemas=customer
quarkus.flyway.locations=db/migration
