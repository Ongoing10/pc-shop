quarkus.application.name=media-service
quarkus.http.port=8088
quarkus.devservices.enabled=false
# Giới hạn upload: phải thống nhất với gateway (plan 7.6)
quarkus.http.limits.max-body-size=20M

quarkus.oidc.auth-server-url=http://localhost:8180/realms/pcshop
quarkus.oidc.client-id=pcshop-backend
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.connection-delay=30S
pcshop.security.permission-client-id=pcshop-backend

quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.default-schema=media
quarkus.flyway.schemas=media

# URL công khai (đi qua gateway) để trả cho client
pcshop.public-base-url=http://localhost:8000
